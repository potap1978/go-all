<head>

<x-dc>
<helmet><link rel="stylesheet" href="../heroui-tokens.css"><script src="../ga-icons.js"></script><style>a{color:inherit}a:hover{opacity:.8}</style></helmet>

</sc-if>

  </header>
  <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column-reverse;background:var(--background-secondary)">
   <div style="display:grid;gap:10px;padding:14px 10px 12px">

            <sc-for list="{{ m.lines }}" as="l" hint-placeholder-count="3"><div style="display:flex;gap:8px;align-items:baseline;font:{{ l.fw }} {{ l.fs }}/1.4 var(--font);color:{{ l.c }};min-height:{{ l.mh }};overflow-wrap:anywhere"><sc-if value="{{ l.hasDot }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;flex:none;border-radius:50%;background:{{ l.dot }};transform:translateY(-1px)"></span></sc-if><span>{{ l.t }}</span></div></sc-for>

              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>

  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bot&quot;,&quot;miniapp&quot;],&quot;default&quot;:&quot;bot&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;users&quot;,&quot;user&quot;,&quot;qr&quot;,&quot;share&quot;,&quot;confirm&quot;],&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;users&quot;,&quot;user&quot;,&quot;profiles&quot;,&quot;settings&quot;,&quot;appearance&quot;],&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;system&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;preset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ga&quot;,&quot;hero&quot;,&quot;lavender&quot;,&quot;mint&quot;,&quot;graphite&quot;,&quot;paper&quot;],&quot;default&quot;:&quot;ga&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tgScheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;day&quot;,&quot;night&quot;,&quot;off&quot;],&quot;default&quot;:&quot;day&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;persist&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
