# Kaskad 3 gateway: OpenConnect (ocserv) inbound. Written by kaskadctl, edits are lost.
auth = "plain[passwd=/etc/kaskad/gw/ocserv/ocpasswd]"
tcp-port = 4443
udp-port = 4443
run-as-user = nobody
run-as-group = daemon
socket-file = /run/kaskad-gw-ocserv/ocserv.sock
occtl-socket-file = /run/kaskad-gw-ocserv/occtl.sock
use-occtl = true
server-cert = /etc/kaskad/gw/ocserv/server-cert.pem
server-key = /etc/kaskad/gw/ocserv/server-key.pem
isolate-workers = true
max-clients = 256
max-same-clients = 2
rate-limit-ms = 100
keepalive = 32400
dpd = 90
mobile-dpd = 300
switch-to-tcp-timeout = 25
try-mtu-discovery = false
tls-priorities = "NORMAL:%SERVER_PRECEDENCE:%COMPAT:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1"
auth-timeout = 240
min-reauth-time = 300
max-ban-score = 80
ban-reset-time = 1200
cookie-timeout = 300
deny-roaming = false
rekey-time = 172800
rekey-method = ssl
connect-script = /etc/kaskad/gw/ocserv/hook.sh
disconnect-script = /etc/kaskad/gw/ocserv/hook.sh
device = kgw-oc
predictable-ips = true
ipv4-network = 10.77.11.0
ipv4-netmask = 255.255.255.0
tunnel-all-dns = true
dns = 10.77.0.1
ping-leases = false
route = default
config-per-user = /etc/kaskad/gw/ocserv/config-per-user/
cisco-client-compat = true
dtls-legacy = true
