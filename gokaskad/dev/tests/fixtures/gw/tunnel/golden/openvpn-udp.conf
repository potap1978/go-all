# Kaskad 3 gateway: OpenVPN UDP inbound (kgw-ovpn-u). Written by kaskadctl, edits are lost.
port 1194
proto udp
dev kgw-ovpn-u
dev-type tun
topology subnet
server 10.77.9.0 255.255.255.0
client-config-dir /etc/openvpn/kaskad/ccd-udp
ccd-exclusive
ca /etc/kaskad/gw/openvpn/ca.crt
cert /etc/kaskad/gw/openvpn/server.crt
key /etc/kaskad/gw/openvpn/server.key
dh none
tls-crypt /etc/kaskad/gw/openvpn/tc.key
crl-verify /etc/openvpn/kaskad/crl.pem
tls-version-min 1.2
data-ciphers AES-256-GCM:CHACHA20-POLY1305
keepalive 10 60
user nobody
group nogroup
persist-key
persist-tun
explicit-exit-notify 1
multihome
push "redirect-gateway def1 ipv6"
push "dhcp-option DNS 10.77.0.1"
status /run/kaskad-gw-ovpn-udp/status 10
status-version 2
management /run/kaskad-gw-ovpn-udp/mgmt.sock unix
verb 3
