# Kaskad 3 gateway: OpenVPN TCP inbound (kgw-ovpn-t). Written by kaskadctl, edits are lost.
port 8443
proto tcp-server
dev kgw-ovpn-t
dev-type tun
topology subnet
server 10.77.10.0 255.255.255.0
client-config-dir /etc/openvpn/kaskad/ccd-tcp
ccd-exclusive
ca /etc/kaskad/gw/openvpn/ca.crt
cert /etc/kaskad/gw/openvpn/server.crt
key /etc/kaskad/gw/openvpn/server.key
dh none
tls-crypt /etc/kaskad/gw/openvpn/tc.key
crl-verify /etc/openvpn/kaskad/crl.pem
tls-version-min 1.2
data-ciphers AES-256-GCM:CHACHA20-POLY1305
keepalive 10 60
user nobody
group nogroup
persist-key
persist-tun
push "redirect-gateway def1 ipv6"
push "dhcp-option DNS 10.77.0.1"
status /run/kaskad-gw-ovpn-tcp/status 10
status-version 2
management /run/kaskad-gw-ovpn-tcp/mgmt.sock unix
verb 3
