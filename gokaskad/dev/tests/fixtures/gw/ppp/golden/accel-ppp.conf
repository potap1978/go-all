# Kaskad 3 gateway: accel-ppp of the PPP inbounds (L2TP, PPTP, SSTP). Written by kaskadctl, edits are lost.
[modules]
path=/opt/kaskad/accel-ppp/lib/accel-ppp
log_syslog
chap-secrets
auth_mschap_v2
auth_mschap_v1
auth_chap_md5
pppd_compat
l2tp
pptp
sstp

[core]
log-error=/var/log/kaskad-gw-accel/core.log

[common]
single-session=replace
check-ip=1

[ppp]
verbose=0
min-mtu=1280
mtu=1400
mru=1400
ipv4=require
ipv6=deny
lcp-echo-interval=20
lcp-echo-failure=3

[l2tp]
verbose=0
dictionary=/opt/kaskad/accel-ppp/share/accel-ppp/l2tp/dictionary
hello-interval=60
# Kaskad's patch (vendor/accel-ppp-l2tp-peer-restart.patch): an SCCRQ from the address of a tunnel replaces it
peer-restart=1
mppe=allow
ppp-max-mtu=1400
ifname=kgw-l2tp%d

[pptp]
verbose=0
echo-interval=30
mppe=require
ppp-max-mtu=1400
ifname=kgw-pptp%d

[sstp]
verbose=0
port=4433
accept=ssl
ssl-protocol=tls1.2,tls1.3
ssl-prefer-server-ciphers=1
ssl-pemfile=/etc/kaskad/gw/tls/server.crt
ssl-keyfile=/etc/kaskad/gw/tls/server.key
cert-hash-proto=sha1,sha256
ppp-max-mtu=1400
ifname=kgw-sstp%d

[dns]
dns1=10.77.0.1

[client-ip-range]
0.0.0.0/5
8.0.0.0/7
10.0.0.0/10
10.64.0.0/13
10.72.0.0/14
10.76.0.0/16
10.78.0.0/15
10.80.0.0/12
10.96.0.0/11
10.128.0.0/9
11.0.0.0/8
12.0.0.0/6
16.0.0.0/4
32.0.0.0/3
64.0.0.0/2
128.0.0.0/1

[chap-secrets]
gw-ip-address=10.77.5.1
chap-secrets=/etc/kaskad/gw/accel/chap-secrets

[pppd-compat]
verbose=0
ip-pre-up=/etc/kaskad/gw/accel/ip-pre-up
ip-up=/etc/kaskad/gw/accel/ip-up
ip-down=/etc/kaskad/gw/accel/ip-down

[log]
syslog=kaskad-gw-accel,daemon
level=3

[cli]
verbose=0
tcp=127.0.0.1:2001
password=Pw2qqqqqqqqqqqqqqqqqqqqq
