# Kaskad 3 gateway: strongSwan of L2TP/IPsec and IKEv2 (swanctl). Written by kaskadctl, edits are lost.
connections {
    kaskad-l2tp {
        version = 1
        proposals = aes256-sha256-modp2048,aes128-sha256-modp2048,aes256-sha1-modp2048,aes128-sha1-modp2048,aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024
        rekey_time = 0s
        dpd_delay = 30s
        local {
            auth = psk
        }
        remote {
            auth = psk
        }
        children {
            kaskad-l2tp {
                mode = transport
                local_ts = dynamic[udp/1701]
                remote_ts = dynamic[udp]
                esp_proposals = aes256-sha256,aes128-sha256,aes256-sha1,aes128-sha1,3des-sha1
                rekey_time = 0s
                dpd_action = clear
            }
        }
    }
    kaskad-ikev2 {
        version = 2
        proposals = aes256-sha256-modp2048,aes256gcm16-prfsha256-modp2048,aes256-sha256-ecp256,aes256gcm16-prfsha256-ecp256,aes128-sha256-modp2048,aes256-sha1-modp2048,aes256-sha1-modp1024,aes128-sha1-modp1024
        rekey_time = 0s
        dpd_delay = 30s
        pools = kaskad-ikev2
        send_cert = always
        send_certreq = no
        fragmentation = yes
        unique = replace
        local {
            auth = pubkey
            certs = kaskad-ikev2.pem
            id = 203.0.113.10
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
        }
        children {
            kaskad-ikev2 {
                local_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16,aes128gcm16,aes256-sha256,aes128-sha256,aes256-sha1,aes128-sha1,aes256gcm16-modp2048,aes256-sha256-modp2048,aes256gcm16-ecp256,aes256-sha256-ecp256
                rekey_time = 0s
                dpd_action = clear
                updown = /etc/kaskad/gw/ipsec/updown.sh
            }
        }
    }
}

pools {
    kaskad-ikev2 {
        addrs = 10.77.8.10-10.77.8.254
        dns = 10.77.0.1
    }
}

secrets {
    ike-kaskad-l2tp {
        secret = 0x50736b4f665468654e6f6465323334353637383961626364
    }
    # device d-iphone
    eap-d-iphone {
        id = ayfon-1a2b
        secret = 0x4970686f6e655061737332333435
    }
    # device d-win
    eap-d-win {
        id = noutbuk-3c4d
        secret = 0x57696e506173733637383978797a
    }
}
